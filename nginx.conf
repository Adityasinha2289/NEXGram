server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed assets are immutable; the shell and worker must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A cached service worker would pin users to an old deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: every unknown path is a React route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
