[pytest]
# Without this, only `python -m pytest` works: that form puts the working
# directory on sys.path, while a bare `pytest` does not, so `import app` fails
# during conftest collection. CI runs the bare form, which is how this surfaced.
pythonpath = .
testpaths = tests

# Quieter output by default; the deprecation warnings come from pinned
# dependencies rather than from this codebase.
addopts = --strict-markers
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore::pydantic.PydanticDeprecatedSince20
