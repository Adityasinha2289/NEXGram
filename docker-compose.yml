# One command to bring up the whole stack on Postgres, which is what the app
# targets in production. `docker compose up` and the API is seeded and serving.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexgram
      POSTGRES_PASSWORD: nexgram
      POSTGRES_DB: nexgram
    volumes:
      - nexgram-db:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before starting the API, so migrations never
      # race an unready database.
      test: ["CMD-SHELL", "pg_isready -U nexgram -d nexgram"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://nexgram:nexgram@db:5432/nexgram
      ENVIRONMENT: production
      # Compose-local values. A real deployment supplies its own.
      SECRET_KEY: ${SECRET_KEY:-compose-local-secret-change-me}
      OPS_TOKEN: ${OPS_TOKEN:-compose-local-ops-token}
      ALLOWED_ORIGINS: http://localhost:4173,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - api
    ports:
      - "4173:80"

volumes:
  nexgram-db:
